<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zenken</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0c10;
    --bg-soft: #14161c;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --accent: #5eead4;
    --border: #23262f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --bg-soft: #ffffff;
      --text: #16181d;
      --muted: #5b606b;
      --accent: #0f9d8f;
      --border: #e4e5e9;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    border-radius: 14px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    color: #05201c;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  footer {
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .banner {
    max-width: 560px;
    width: 100%;
    margin: 0 0 20px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="banner">Live demo &mdash; DevOps Conference 2026: deployed via GitHub &rarr; PR &rarr; CI &rarr; deploy</div>
  <div class="card">
    <div class="mark">Z</div>
    <h1>zenken.es</h1>
    <p>This site is up and running. Deployed via git push.</p>
    <div class="status"><span class="dot"></span> Online</div>
  </div>
  <footer>&copy; 2026 Zenken</footer>
</body>
</html>
