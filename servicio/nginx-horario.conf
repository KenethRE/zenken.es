# Bloques para añadir dentro del «server { listen 443 ssl; server_name zenken.es … }»
# de /etc/nginx/conf.d/zenken.es.conf

    # Servicio de importación de horarios (contenedor zenken-horario)
    location /horario/api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    # El código del servicio está en el repositorio, pero no debe servirse como web
    location ^~ /servicio/ {
        deny all;
    }
