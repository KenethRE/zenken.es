<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Juega a reconocer símbolos, montar circuitos, encontrar averías y leer esquemas eléctricos de avión.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Banco de esquemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="ud2-banco-de-esquemas.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Banco de <span>esquemas</span></h1>
      <p>Módulo 1444 · UD2 Montaje de circuitos eléctricos y electrónicos · Barra de 28 V CC</p>
    </div>
    <div class="plate" id="best">Mejores marcas · —</div>
  </header>

  <div class="modes" role="tablist" aria-label="Modos de juego">
    <button role="tab" id="tab-simbolos" aria-selected="true" data-mode="simbolos">¿Qué símbolo es?<small>12 símbolos contra reloj</small></button>
    <button role="tab" id="tab-montar" aria-selected="false" data-mode="montar">Monta el circuito<small>4 órdenes de trabajo</small></button>
    <button role="tab" id="tab-averia" aria-selected="false" data-mode="averia">Encuentra la avería<small>Polímetro virtual</small></button>
    <button role="tab" id="tab-leer" aria-selected="false" data-mode="leer">Lee el esquema<small>Luces de aterrizaje</small></button>
  </div>

  <main id="app"></main>

  <footer>
    <span>Símbolos según la UNE-EN 60617 y los apuntes de la UD1 y la UD2.</span>
    <span>Los circuitos son ejemplos didácticos de 28 V CC, no los de un avión concreto.</span>
  </footer>
</div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const fmt = (x, d = 1) => x.toFixed(d).replace(".", ",");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Mejores marcas (solo en este navegador) ---------- */
const BEST_KEY = "banco-esquemas-best";
function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; } }
function saveBest(mode, pts) {
  const b = loadBest(); if (!(mode in b) || pts > b[mode]) { b[mode] = pts; try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) {} }
  showBest();
}
function showBest() {
  const b = loadBest(); const n = { simbolos: "Símbolos", montar: "Montaje", averia: "Avería", leer: "Esquema" };
  const parts = Object.keys(n).filter(k => k in b).map(k => `${n[k]} ${b[k]}`);
  $("#best").textContent = "Mejores marcas · " + (parts.length ? parts.join(" · ") : "—");
}
showBest();

/* ---------- Biblioteca de símbolos (horizontales, de x=0 a x=L) ---------- */
const L = 80, M = L / 2;
const ln = (x1, y1, x2, y2, c = "s") => `<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const leads = (a, b) => ln(0, 0, a, 0) + ln(b, 0, L, 0);
const arrowHead = (x, y, ang) => { const a = ang * Math.PI / 180, s = 7; const p1 = [x - s * Math.cos(a - 0.45), y - s * Math.sin(a - 0.45)], p2 = [x - s * Math.cos(a + 0.45), y - s * Math.sin(a + 0.45)]; return `<path class="fillink" d="M${x} ${y} L${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} Z"/>`; };
const circleSym = (letter, extra = "") => leads(M - 15, M + 15) + `<g class="rotor-wrap"><circle class="s lampbody" cx="${M}" cy="0" r="15" style="fill:var(--sheet)"/>${extra}<text class="txt" x="${M}" y="5" text-anchor="middle" style="font-size:15px">${letter}</text></g>`;
const SYM = {
  bateria: { n: "Batería", g: "fuente", d: () => leads(M - 12, M + 12) + ln(M - 12, -16, M - 12, 16) + `<line class="s" x1="${M - 5}" y1="-8" x2="${M - 5}" y2="8" style="stroke-width:5"/>` + ln(M + 3, -16, M + 3, 16) + `<line class="s" x1="${M + 10}" y1="-8" x2="${M + 10}" y2="8" style="stroke-width:5"/>` + ln(M - 12, 0, M - 12, 0) + `<text class="txt" x="${M - 22}" y="-12">+</text>` },
  pila: { n: "Pila o elemento", g: "fuente", d: () => leads(M - 4, M + 4) + ln(M - 4, -16, M - 4, 16) + `<line class="s" x1="${M + 4}" y1="-8" x2="${M + 4}" y2="8" style="stroke-width:5"/>` + `<text class="txt" x="${M - 16}" y="-12">+</text>` },
  resistencia: { n: "Resistencia", g: "pasivo", d: () => leads(M - 18, M + 18) + `<rect class="s" x="${M - 18}" y="-7" width="36" height="14"/>` },
  reostato: { n: "Resistencia variable (reóstato)", g: "pasivo", d: () => leads(M - 18, M + 18) + `<rect class="s" x="${M - 18}" y="-7" width="36" height="14"/>` + ln(M - 20, 14, M + 18, -14) + arrowHead(M + 20, -15.5, -36) },
  potenciometro: { n: "Potenciómetro", g: "pasivo", d: () => leads(M - 18, M + 18) + `<rect class="s" x="${M - 18}" y="-7" width="36" height="14"/>` + ln(M, -26, M, -10) + arrowHead(M, -8, 90) },
  condensador: { n: "Condensador", g: "pasivo", d: () => leads(M - 4, M + 4) + ln(M - 4, -15, M - 4, 15) + ln(M + 4, -15, M + 4, 15) },
  electrolitico: { n: "Condensador electrolítico", g: "pasivo", d: () => leads(M - 5, M + 4) + `<rect class="s" x="${M - 9}" y="-14" width="4" height="28"/>` + `<rect class="fillink" x="${M + 4}" y="-14" width="5" height="28"/>` + `<text class="txt" x="${M - 22}" y="-12">+</text>` },
  bobina: { n: "Bobina (inductancia)", g: "pasivo", d: () => leads(M - 24, M + 24) + `<path class="s" d="M${M - 24} 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0"/>` },
  diodo: { n: "Diodo", g: "semi", d: () => leads(M - 10, M + 8) + `<path class="fillink" d="M${M - 10} -10 L${M - 10} 10 L${M + 8} 0 Z"/>` + ln(M + 8, -11, M + 8, 11) },
  led: { n: "Diodo LED", g: "semi", d: () => SYM.diodo.d() + ln(M + 2, -14, M + 12, -24) + arrowHead(M + 13, -25, -45) + ln(M + 9, -10, M + 19, -20) + arrowHead(M + 20, -21, -45) },
  zener: { n: "Diodo Zener", g: "semi", d: () => leads(M - 10, M + 8) + `<path class="fillink" d="M${M - 10} -10 L${M - 10} 10 L${M + 8} 0 Z"/>` + `<path class="s" d="M${M + 3} -13 L${M + 8} -11 L${M + 8} 11 L${M + 13} 13"/>` },
  fusible: { n: "Fusible", g: "proteccion", d: () => ln(0, 0, L, 0) + `<rect class="s" x="${M - 18}" y="-7" width="36" height="14" style="fill:none"/>` },
  disyuntor: { n: "Disyuntor (breaker)", g: "proteccion", d: () => leads(M - 16, M + 16) + `<circle class="s" cx="${M - 16}" cy="0" r="3" style="fill:var(--sheet)"/><circle class="s" cx="${M + 16}" cy="0" r="3" style="fill:var(--sheet)"/><path class="s" d="M${M - 15} -4 Q${M} -22 ${M + 15} -4"/>` + ln(M, -13, M, -22) + ln(M - 6, -22, M + 6, -22) },
  interruptor: { n: "Interruptor", g: "mando", d: () => leads(M - 16, M + 16) + `<circle class="fillink" cx="${M - 16}" cy="0" r="3"/><circle class="s" cx="${M + 16}" cy="0" r="3" style="fill:var(--sheet)"/>` + ln(M - 16, 0, M + 14, -14) },
  conmutador: { n: "Conmutador", g: "mando", d: () => ln(0, 0, M - 16, 0) + `<circle class="fillink" cx="${M - 16}" cy="0" r="3"/>` + ln(M - 16, 0, M + 12, -12) + `<circle class="s" cx="${M + 16}" cy="-14" r="3" style="fill:var(--sheet)"/><circle class="s" cx="${M + 16}" cy="10" r="3" style="fill:var(--sheet)"/>` + ln(M + 19, -14, L, -14) + ln(M + 19, 10, L, 10) },
  pulsador: { n: "Pulsador (normalmente abierto)", g: "mando", d: () => leads(M - 16, M + 16) + `<circle class="fillink" cx="${M - 16}" cy="0" r="3"/><circle class="fillink" cx="${M + 16}" cy="0" r="3"/>` + ln(M - 16, -8, M + 16, -8) + ln(M, -8, M, -20) + ln(M - 6, -20, M + 6, -20) },
  bobina_rele: { n: "Bobina de relé", g: "mando", d: () => leads(M - 14, M + 14) + `<rect class="s" x="${M - 14}" y="-10" width="28" height="20" style="fill:var(--sheet)"/>` + ln(M - 14, 10, M + 14, -10) },
  contacto_rele: { n: "Contacto de relé (NA)", g: "mando", d: () => leads(M - 16, M + 16) + `<circle class="fillink" cx="${M - 16}" cy="0" r="3"/><circle class="fillink" cx="${M + 16}" cy="0" r="3"/>` + ln(M - 16, 0, M + 14, -14) + `<line class="s" x1="${M}" y1="-8" x2="${M}" y2="-24" style="stroke-dasharray:3 3"/>` },
  lampara: { n: "Lámpara", g: "receptor", d: () => leads(M - 15, M + 15) + `<circle class="s lampbody" cx="${M}" cy="0" r="15" style="fill:var(--sheet)"/>` + ln(M - 10.6, -10.6, M + 10.6, 10.6) + ln(M - 10.6, 10.6, M + 10.6, -10.6) },
  motor: { n: "Motor", g: "receptor", d: () => leads(M - 15, M + 15) + `<circle class="s" cx="${M}" cy="0" r="15" style="fill:var(--sheet)"/><g class="rotor"><text class="txt" x="${M}" y="5" text-anchor="middle" style="font-size:15px">M</text></g>` },
  generador: { n: "Generador", g: "fuente", d: () => circleSym("G") },
  amperimetro: { n: "Amperímetro", g: "medida", d: () => circleSym("A") },
  voltimetro: { n: "Voltímetro", g: "medida", d: () => circleSym("V") },
  /* símbolos de un solo terminal o con forma propia (solo en «¿Qué símbolo es?») */
  masa: { n: "Masa (estructura)", g: "conexion", solo: true, d: () => ln(M, -24, M, 4) + ln(M - 18, 4, M + 18, 4) + ln(M - 11, 11, M + 11, 11) + ln(M - 5, 18, M + 5, 18) },
  union: { n: "Cruce con conexión (unión)", g: "conexion", solo: true, d: () => ln(M - 34, 0, M + 34, 0) + ln(M, -26, M, 26) + `<circle class="dot" cx="${M}" cy="0" r="5"/>` },
  cruce: { n: "Cruce sin conexión", g: "conexion", solo: true, d: () => ln(M - 34, 0, M + 34, 0) + ln(M, -26, M, 26) },
  antena: { n: "Antena", g: "conexion", solo: true, d: () => ln(M, 26, M, -6) + ln(M, -6, M - 16, -26) + ln(M, -6, M + 16, -26) + ln(M, -6, M, -26) },
  transformador: { n: "Transformador", g: "pasivo", solo: true, d: () => `<path class="s" d="M${M - 14} -24 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12 a6 6 0 0 1 0 12"/><path class="s" d="M${M + 14} -24 a6 6 0 0 0 0 12 a6 6 0 0 0 0 12 a6 6 0 0 0 0 12 a6 6 0 0 0 0 12"/>` + ln(M - 2, -26, M - 2, 26) + ln(M + 2, -26, M + 2, 26) + ln(M - 34, -24, M - 14, -24) + ln(M - 34, 24, M - 14, 24) + ln(M + 14, -24, M + 34, -24) + ln(M + 14, 24, M + 34, 24) },
  bocina: { n: "Bocina o altavoz", g: "receptor", solo: true, d: () => `<rect class="s" x="${M - 16}" y="-9" width="10" height="18"/><path class="s" d="M${M - 6} -9 L${M + 12} -22 L${M + 12} 22 L${M - 6} 9"/>` + ln(M - 34, -4, M - 16, -4) + ln(M - 34, 4, M - 16, 4) },
  conector: { n: "Conector (clavija y base)", g: "conexion", solo: true, d: () => ln(M - 34, 0, M - 10, 0) + `<path class="s" d="M${M - 10} -10 L${M - 2} 0 L${M - 10} 10"/>` + `<path class="s" d="M${M + 2} -10 L${M + 10} 0 L${M + 2} 10"/>` + ln(M + 10, 0, M + 34, 0) },
};
const svgFrag = (type) => SYM[type].d();
function symbolSvg(type, vb = "-6 -34 92 68") { return `<svg viewBox="${vb}" xmlns="${NS}" class="sch" aria-hidden="true">${svgFrag(type)}</svg>`; }

/* Coloca un símbolo entre dos puntos (horizontal o vertical, longitud 80) */
function place(type, x1, y1, x2, y2, extraClass = "", id = "") {
  const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  return `<g ${id ? `id="${id}"` : ""} class="${extraClass}" transform="translate(${x1} ${y1}) rotate(${ang})">${svgFrag(type)}</g>`;
}
const poly = (pts, cls = "w", id = "") => `<polyline ${id ? `id="${id}"` : ""} class="${cls}" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
const ground = (x, y) => `<g transform="translate(${x - M} ${y + 24})">${SYM.masa.d()}</g>`;
const jdot = (x, y) => `<circle class="dot" cx="${x}" cy="${y}" r="4.5"/>`;
const text = (x, y, t, cls = "lbl", anchor = "start") => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`;

/* ---------- Pestañas ---------- */
let stopCurrent = () => {};
const modes = { simbolos: modoSimbolos, montar: modoMontar, averia: modoAveria, leer: modoLeer };
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => select(b.dataset.mode)));
function select(m) {
  stopCurrent(); stopCurrent = () => {};
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
  try { localStorage.setItem("banco-esquemas-tab", m); } catch (e) {}
  modes[m]();
}

/* ==========================================================
   1. ¿QUÉ SÍMBOLO ES?
   ========================================================== */
function modoSimbolos() {
  const RONDAS = 12, TIEMPO = 12;
  const pool = shuffle(Object.keys(SYM)).slice(0, RONDAS);
  let i = 0, pts = 0, racha = 0, aciertos = 0, t0 = 0, raf = 0, locked = false;
  const app = $("#app");
  app.innerHTML = `<div class="stage"><section class="board"><span class="tag">SÍMBOLO</span>
      <div class="quiz"><div class="symbox" id="symbox"></div><div class="opts" id="opts"></div></div>
      <div style="margin-top:12px" class="timer" aria-hidden="true"><i id="bar"></i></div>
      <p class="feedback" id="fb" aria-live="polite"></p></section>
    <aside class="side"><div class="card"><h3>Marcador</h3>
      <div class="score"><div><small>Puntos</small><span id="pts">0</span></div><div><small>Ronda</small><span id="ron">1/${RONDAS}</span></div><div><small>Racha</small><span id="rac">0</span></div></div></div>
      <div class="card"><h2>Cómo se juega</h2><p>Elige qué representa cada símbolo antes de que se acabe la barra. Cuanto antes contestes, más puntos; cada acierto seguido suma un extra.</p>
      <p style="color:var(--muted);font-size:.9rem">Son los símbolos que vas a leer en el WDM y en los esquemas de la UD2: fuentes, protección, mando, receptores, medida y conexión.</p></div></aside></div>`;
  function ronda() {
    locked = false;
    const t = pool[i], g = SYM[t].g;
    const mismos = shuffle(Object.keys(SYM).filter(k => k !== t && SYM[k].g === g));
    const otros = shuffle(Object.keys(SYM).filter(k => k !== t && SYM[k].g !== g));
    const opts = shuffle([t, ...mismos.slice(0, 2), ...otros].slice(0, 4));
    $("#symbox").innerHTML = symbolSvg(t);
    $("#opts").innerHTML = opts.map(o => `<button class="opt" data-k="${o}">${SYM[o].n}</button>`).join("");
    $("#opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => responder(b.dataset.k)));
    $("#fb").textContent = ""; $("#fb").className = "feedback";
    $("#ron").textContent = `${i + 1}/${RONDAS}`;
    t0 = performance.now(); tick();
  }
  function tick() {
    const f = Math.max(0, 1 - (performance.now() - t0) / (TIEMPO * 1000));
    $("#bar").style.transform = `scaleX(${f})`;
    if (f <= 0) { responder(null); return; }
    raf = requestAnimationFrame(tick);
  }
  function responder(k) {
    if (locked) return; locked = true; cancelAnimationFrame(raf);
    const t = pool[i], ok = k === t;
    $("#opts").querySelectorAll(".opt").forEach(b => { if (b.dataset.k === t) b.classList.add("right"); else if (b.dataset.k === k) b.classList.add("wrong"); b.disabled = true; });
    if (ok) {
      const rest = Math.max(0, TIEMPO - (performance.now() - t0) / 1000);
      racha++; aciertos++; const gan = 50 + Math.round(rest * 5) + (racha - 1) * 10; pts += gan;
      $("#fb").textContent = `Correcto: ${SYM[t].n}. +${gan} puntos.`; $("#fb").className = "feedback ok";
    } else {
      racha = 0; $("#fb").textContent = k === null ? `Se acabó el tiempo. Era: ${SYM[t].n}.` : `No. Es: ${SYM[t].n}.`; $("#fb").className = "feedback ko";
    }
    $("#pts").textContent = pts; $("#rac").textContent = racha;
    setTimeout(() => { i++; if (i < RONDAS) ronda(); else fin(); }, ok ? 900 : 1700);
  }
  function fin() {
    saveBest("simbolos", pts);
    $(".board").innerHTML = `<span class="tag">RESULTADO</span><div class="end"><strong>${pts}</strong><p>${aciertos} de ${RONDAS} símbolos acertados.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Jugar otra vez</button></div></div>`;
    $("#again").addEventListener("click", modoSimbolos);
  }
  stopCurrent = () => cancelAnimationFrame(raf);
  ronda();
}

/* ==========================================================
   2. MONTA EL CIRCUITO
   ========================================================== */
const NIVELES = [
  { titulo: "Luz de lectura del asiento", orden: "Alimenta una lámpara de lectura desde la barra de 28 V. Debe estar protegida y el pasajero la enciende y la apaga.",
    palette: ["disyuntor", "fusible", "interruptor", "lampara", "diodo", "condensador", "motor", "resistencia"],
    draw: () => place("bateria", 60, 160, 60, 240) + poly([[60, 160], [60, 70], [140, 70]]) + poly([[220, 70], [300, 70]]) + poly([[380, 70], [480, 70], [480, 130]]) + poly([[480, 210], [480, 300], [60, 300], [60, 240]]) + ground(270, 300)
      + text(24, 205, "28 V") + text(140, 50, "PROTECCIÓN") + text(300, 50, "MANDO") + text(500, 175, "RECEPTOR"),
    slots: [{ id: "a", x1: 140, y1: 70, x2: 220, y2: 70, ok: ["disyuntor", "fusible"], why: "La protección (disyuntor o fusible) va justo después de la barra." },
            { id: "b", x1: 300, y1: 70, x2: 380, y2: 70, ok: ["interruptor"], why: "Para encender y apagar hace falta un interruptor (el pulsador volvería a abrir al soltarlo)." },
            { id: "c", x1: 480, y1: 130, x2: 480, y2: 210, ok: ["lampara"], why: "El receptor es la lámpara." }],
    live: [[60, 160, 60, 70, 140, 70], [480, 210, 480, 300, 60, 300, 60, 240]], fin: "Circuito básico: generador, protección, mando, receptor y retorno por la masa (estructura)." },
  { titulo: "Luces de navegación", orden: "Las dos luces de navegación (roja y verde) se encienden con el mismo interruptor. Si se funde una, la otra debe seguir encendida.",
    palette: ["disyuntor", "fusible", "interruptor", "pulsador", "lampara", "resistencia", "condensador", "diodo"],
    draw: () => place("bateria", 50, 160, 50, 240) + poly([[50, 160], [50, 70], [110, 70]]) + poly([[190, 70], [250, 70]]) + poly([[330, 70], [560, 70], [560, 130]]) + poly([[420, 70], [420, 130]]) + jdot(420, 70)
      + poly([[420, 210], [420, 300]]) + poly([[560, 210], [560, 300], [50, 300], [50, 240]]) + jdot(420, 300) + ground(240, 300)
      + text(14, 205, "28 V") + text(110, 50, "PROTECCIÓN") + text(250, 50, "MANDO") + text(380, 175, "NAV R") + text(578, 175, "NAV V"),
    slots: [{ id: "a", x1: 110, y1: 70, x2: 190, y2: 70, ok: ["disyuntor", "fusible"], why: "Primero la protección." },
            { id: "b", x1: 250, y1: 70, x2: 330, y2: 70, ok: ["interruptor"], why: "Un solo interruptor manda las dos ramas porque está antes de la derivación." },
            { id: "c", x1: 420, y1: 130, x2: 420, y2: 210, ok: ["lampara"], why: "Cada rama lleva su lámpara." },
            { id: "d", x1: 560, y1: 130, x2: 560, y2: 210, ok: ["lampara"], why: "Cada rama lleva su lámpara." }],
    live: [[50, 160, 50, 70, 110, 70], [560, 210, 560, 300, 50, 300, 50, 240]], fin: "En paralelo cada lámpara recibe los 28 V y funciona aunque la otra se funda." },
  { titulo: "Bomba de combustible con relé", orden: "El interruptor de cabina (circuito de mando, poca corriente) debe activar un relé que da la corriente fuerte al motor de la bomba (circuito de potencia).",
    palette: ["interruptor", "bobina_rele", "contacto_rele", "motor", "lampara", "resistencia", "fusible", "diodo"],
    draw: () => place("bateria", 50, 150, 50, 230) + poly([[50, 150], [50, 50], [600, 50]]) + poly([[50, 230], [50, 320], [600, 320]]) + ground(330, 320)
      + place("disyuntor", 200, 50, 200, 130) + place("disyuntor", 440, 50, 440, 130) + jdot(200, 50) + jdot(440, 50) + jdot(200, 320) + jdot(440, 320)

  const app = $("#app");
  app.innerHTML = `<div class="stage"><section class="board"><span class="tag">ESQUEMA · LUCES DE ATERRIZAJE</span>
      <svg class="sch" id="sch" viewBox="0 0 640 392" role="img" aria-label="Esquema de las luces de aterrizaje con relé">${esquemaLuces()}</svg>
      <p class="feedback" style="font-size:.85rem">CB1 y S1 forman el circuito de mando; CB2 y el contacto de K1, el de potencia. La línea discontinua une la bobina con su contacto.</p></section>
    <aside class="side"><div class="card" id="qcard"></div>
      <div class="card"><div class="score"><div><small>Puntos</small><span id="pts">0</span></div><div><small>Pregunta</small><span id="pn">1/${PREGUNTAS.length}</span></div></div></div></aside></div>`;
  function marcar(ids) {
    $("#sch").querySelectorAll(".hlbox").forEach(n => n.remove());
    ids.forEach(id => { const el = document.getElementById(id); if (!el) return; const b = el.getBBox ? el.getBBox() : null; if (!b) return;
      const m = el.getCTM && el.ownerSVGElement ? el.ownerSVGElement.getCTM().inverse().multiply(el.getCTM()) : null;
      const p1 = new DOMPoint(b.x, b.y).matrixTransform(m), p2 = new DOMPoint(b.x + b.width, b.y + b.height).matrixTransform(m);
      const r = document.createElementNS(NS, "rect"); r.setAttribute("class", "hlbox");
      r.setAttribute("x", Math.min(p1.x, p2.x) - 8); r.setAttribute("y", Math.min(p1.y, p2.y) - 8);
      r.setAttribute("width", Math.abs(p2.x - p1.x) + 16); r.setAttribute("height", Math.abs(p2.y - p1.y) + 16); $("#sch").appendChild(r); });
  }
  function pregunta() {
    marcar([]);
    const P = PREGUNTAS[orden[i]]; const o = shuffle(P.o.map((t, k) => ({ t, ok: k === P.a })));
    $("#pn").textContent = `${i + 1}/${PREGUNTAS.length}`;
    $("#qcard").innerHTML = `<span class="qnum">PREGUNTA ${i + 1}</span><h2 style="text-transform:none;font-size:1.3rem">${P.q}</h2><div class="choices">${o.map((x, k) => `<button data-ok="${x.ok}">${x.t}</button>`).join("")}</div><div id="exp"></div>`;
    $("#qcard").querySelectorAll(".choices button").forEach(b => b.addEventListener("click", () => {
      if ($("#qcard").dataset.done === "1") return; $("#qcard").dataset.done = "1";
      const ok = b.dataset.ok === "true";
      $("#qcard").querySelectorAll(".choices button").forEach(x => { if (x.dataset.ok === "true") { x.style.background = "var(--ok)"; x.style.color = "#fff"; } else if (x === b) { x.style.background = "var(--bad)"; x.style.color = "#fff"; } });
      if (ok) { aciertos++; puntosLeer += 100; $("#pts").textContent = puntosLeer; }
      marcar(P.hl);
      $("#exp").innerHTML = `<p class="explain">${ok ? "<strong>Correcto.</strong> " : "<strong>No.</strong> "}${P.e}</p><button class="btn primary" id="sig" style="margin-top:8px">${i < PREGUNTAS.length - 1 ? "Siguiente" : "Ver resultado"}</button>`;
      $("#sig").addEventListener("click", () => { i++; $("#qcard").dataset.done = "0"; if (i < PREGUNTAS.length) pregunta(); else fin(); });
    }));
  }
  function fin() {
    marcar([]); saveBest("leer", puntosLeer);
    $("#qcard").innerHTML = `<div class="end"><strong>${puntosLeer}</strong><p>${aciertos} de ${PREGUNTAS.length} preguntas acertadas.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Repetir</button></div></div>`;
    $("#again").addEventListener("click", modoLeer);
  }
  pregunta();
}

/* ---------- Arranque ---------- */
let first = "simbolos"; try { const t = localStorage.getItem("banco-esquemas-tab"); if (t && modes[t]) first = t; } catch (e) {}
select(first);
})();
</script>
